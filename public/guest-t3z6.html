<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <link rel="icon" type="image/png" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#222222">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ønskeliste</title>
</head>
<body>
  <h1 id="listTitle">Indlæser...</h1>
  <div class="event-date" id="creatorName"></div>
  <div class="event-date" id="eventDate"></div>

  <button id="copy-guest-link" class="btn secondary">Del ønskeliste</button>
  
  <div id="itemsList"></div>

  <!-- Modal for viewing an item and reserving/cancelling -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2 id="modalName"></h2>
      
      <img id="modalImage" style="display: none; max-width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; margin-bottom: 1rem;">
      
      <div style="margin: 1rem 0;">
        <a id="modalLinkBtn" href="#" target="_blank" rel="noopener" class="btn secondary" style="display: inline-flex; width: auto;">Åbn link i nyt vindue</a>
      </div>
      
      <p id="modalPrice"></p>
      <p id="modalRemark"></p>
      <div id="modalDate" class="item-footer" style="margin-top: 0.5rem; margin-bottom: 1rem;"></div>
      
      <p id="modalStatus"></p>

      <div class="modal-actions">
        <button id="actionBtn" class="btn" style="width: auto;"></button>
        <button class="btn secondary" id="closeBtn" type="button" style="width: auto;">Luk</button>
      </div>
    </div>
  </div>

  <script>
    function formatDanishDate(dateString) {
      if (!dateString) return '';
      return new Date(dateString).toLocaleDateString('da-DK', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const params = new URLSearchParams(location.search);
    const listId = params.get('list');
    let currentItem = null;

    // Get or create a persistent guest token for this browser
    let guestToken = localStorage.getItem('oensker_guest_token');
    if (!guestToken) {
      guestToken = crypto.randomUUID();
      localStorage.setItem('oensker_guest_token', guestToken);
    }

    async function loadList() {
      const res = await fetch(`/lists/${listId}/guest`);
      if (!res.ok) {
        document.getElementById('listTitle').textContent = 'Listen blev ikke fundet';
        return;
      }
      const data = await res.json();
      document.getElementById('listTitle').textContent = data.title;
      document.getElementById('creatorName').textContent = `Af ${data.creator_name}`;

      let dateStr = data.event_date ? formatDanishDate(data.event_date) : '';
      let eventStr = data.event_name ? data.event_name : '';
      let finalString = '';
      if (eventStr && dateStr) finalString = `Til ${eventStr} ${dateStr}`;
      else if (dateStr) finalString = `Til ${dateStr}`;
      else if (eventStr) finalString = `Til ${eventStr}`;
      document.getElementById('eventDate').textContent = finalString;

      const itemsList = document.getElementById('itemsList');
      itemsList.innerHTML = '';
      data.items.forEach(item => {
        const isMine = item.guest_token === guestToken;
        const isReserved = !!item.guest_token;

        const card = document.createElement('div');
        // Add the 'has-image' class if there is a photo URL
        const hasImage = item.photo_url && item.photo_url.includes('/images/');
        card.className = 'item-card' + (hasImage ? ' has-image' : '') + (isMine ? ' mine' : '');
        
        let dateText = '';
        if (item.created_at) {
          const d = new Date(item.created_at);
          dateText = `Tilføjet: ${d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' })}`;
        }

        // Add the image thumbnail to the card
        let mediaHtml = '';
        let imgTag = '';
        
        // Strict check: Only render if it's an actual uploaded image path
        if (item.photo_url && item.photo_url.includes('/images/')) {
          imgTag = `<img src="${item.photo_url}" class="item-img">`;
        }
        
        if (imgTag) {
          mediaHtml = `<div class="media-container">${imgTag}</div>`;
        }

        card.innerHTML = `
          <div class="item-name">${item.name}</div>
          ${mediaHtml}
          <div class="item-footer">
            <div>${item.price ? item.price + ' kr.' : ''}</div>
          </div>
          <span class="badge ${isMine ? 'mine' : (isReserved ? 'reserved' : 'available')}">
            ${isMine ? 'Reserveret af dig' : (isReserved ? 'Reserveret' : 'Ikke reserveret')}
          </span>
        `;
        card.addEventListener('click', () => openItemModal(item, isMine, isReserved));
        itemsList.appendChild(card);
      });
    }

    function openItemModal(item, isMine, isReserved) {
      document.getElementById('modalName').textContent = item.name;
      
      // Handle the Image in the modal
      const modalImg = document.getElementById('modalImage');
      if (item.photo_url) {
        modalImg.src = item.photo_url;
        modalImg.style.display = 'block';
      } else {
        modalImg.style.display = 'none';
      }

      let dateText = '';
      if (item.created_at) {
        const d = new Date(item.created_at);
        dateText = `Tilføjet: ${d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' })}`;
      }
      document.getElementById('modalDate').textContent = dateText;

      document.getElementById('modalPrice').textContent = item.price ? `${item.price} kr.` : '';
      document.getElementById('modalPrice').style.display = item.price ? 'block' : 'none';
      
      document.getElementById('modalRemark').textContent = item.remark ? `Bemærkning: ${item.remark}` : '';
      document.getElementById('modalRemark').style.display = item.remark ? 'block' : 'none';
      
      // Handle the Link Button
      const linkBtn = document.getElementById('modalLinkBtn');
      if (item.link) {
        linkBtn.href = item.link;
        linkBtn.textContent = 'Åbn link i nyt vindue';
        linkBtn.className = 'btn secondary';
        linkBtn.style.opacity = '1';
        linkBtn.style.pointerEvents = 'auto';
      } else {
        linkBtn.removeAttribute('href');
        linkBtn.textContent = 'Intet link angivet';
        linkBtn.className = 'btn secondary';
        linkBtn.style.opacity = '0.5';
        linkBtn.style.pointerEvents = 'none';
      }

      const actionBtn = document.getElementById('actionBtn');
      const statusEl = document.getElementById('modalStatus');

      // Reset UI state
      actionBtn.style.display = 'inline-flex';

      if (isMine) {
        statusEl.textContent = 'Du har reserveret ønsket';
        actionBtn.textContent = 'Annuller min reservation';
        actionBtn.className = 'btn danger';
        actionBtn.onclick = () => cancelReservation(item.id || item.item_id);
      } else if (isReserved) {
        statusEl.textContent = 'Allerede reserveret af en anden';
        actionBtn.style.display = 'none';
      } else {
        statusEl.textContent = 'Ikke reserveret';
        actionBtn.textContent = 'Reserver';
        actionBtn.className = 'btn';
        actionBtn.onclick = () => reserveItem(item.item_id || item.id); 
      }

      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      currentItem = null;
    }

    async function reserveItem(id) {
      await fetch(`/items/${id}/reserve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guest_token: guestToken, guest_name: null })
      });
      closeModal();
      loadList();
    }

    async function cancelReservation(itemId) {
      await fetch(`/items/${itemId}/reserve`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guest_token: guestToken })
      });
      closeModal();
      loadList();
    }

    document.getElementById('closeBtn').addEventListener('click', closeModal);

    // --- SMART SHARE (Guest View) ---
    const copyBtn = document.getElementById('copy-guest-link');
    if (copyBtn) {
      copyBtn.addEventListener('click', async (e) => {
        const url = location.href;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        if (isMobile && navigator.share) {
          try { 
            await navigator.share({ title: 'Ønskeliste', url: url }); 
          } catch (err) { 
            // User cancelled
          }
        } else {
          await navigator.clipboard.writeText(url);
          const originalText = e.target.textContent;
          e.target.textContent = 'Link kopieret';
          setTimeout(() => e.target.textContent = originalText, 2000);
        }
      });
    }    

    loadList();
  </script>
</body>
</html>
