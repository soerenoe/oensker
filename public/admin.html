<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Ønsker</title>
  <link rel="icon" type="image/png" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    .admin-table th, .admin-table td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    .admin-table th { font-weight: 600; background: #f4f1eb; }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>
  <p class="hint">Her kan du administrere alle lister og se ressourceforbrug.</p>
  
  <div class="card">
    <h2>System Status</h2>
    <p><strong>Antal lister:</strong> <span id="totalLists">0</span></p>
    <p><strong>Antal ønsker:</strong> <span id="totalItems">0</span></p>
    <p><strong>Antal uploadede billeder:</strong> <span id="totalImages">0</span></p>
    <p><strong>Estimeret lagerforbrug:</strong> <span id="totalStorage">0 KB</span></p>
  </div>

  <table class="admin-table">
    <thead>
      <tr>
        <th>Titel</th>
        <th>Oprettet</th>
        <th>Ønsker</th>
        <th>Billeder</th>
        <th>Handling</th>
      </tr>
    </thead>
    <tbody id="adminListBody">
      <!-- Injected via JS -->
    </tbody>
  </table>

  <script>
    const adminPassword = prompt("Indtast admin adgangskode:");
    if (!adminPassword) { window.location.href = "/"; }

    async function loadAdmin() {
      try {
        const res = await fetch(`/admin/lists?auth=${adminPassword}`);
        if (res.status === 401) { alert("Forkert adgangskode"); window.location.href = "/"; return; }
        
        const data = await res.json();
        document.getElementById('totalLists').textContent = data.stats.totalLists;
        document.getElementById('totalItems').textContent = data.stats.totalItems;
        document.getElementById('totalImages').textContent = data.stats.totalImages;
        
        // Estimate storage: ~2KB per text item, ~100KB per image
        const estimatedKB = (data.stats.totalItems * 2) + (data.stats.totalImages * 100);
        let storageText = `${estimatedKB} KB`;
        if (estimatedKB > 1024) storageText = `${(estimatedKB / 1024).toFixed(2)} MB`;
        
        document.getElementById('totalStorage').textContent = storageText;

        const tbody = document.getElementById('adminListBody');
        tbody.innerHTML = data.lists.map(l => `
          <tr>
            <td>${l.title}</td>
            <td>${new Date(l.created_at).toLocaleDateString('da-DK')}</td>
            <td>${l.item_count}</td>
            <td>${l.image_count}</td>
            <td><button class="btn danger" style="width: auto; padding: 0.2rem 0.5rem;" onclick="deleteList('${l.list_id}')">Slet</button></td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteList(id) {
      if (!confirm("Er du sikker på, at du vil slette denne liste?")) return;
      await fetch(`/lists/${id}?creator_token=admin&auth=${adminPassword}`, { method: 'DELETE' });
      loadAdmin();
    }

    loadAdmin();
  </script>
</body>
</html>
