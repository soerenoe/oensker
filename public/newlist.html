<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#222222">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ønsker</title>
</head>
<body>
  <a href="/" style="display: inline-block; margin-bottom: 1rem; color: #666; text-decoration: none; font-size: 0.9rem;">← Tilbage til mine lister</a>
  <h1 id="pageTitle">Opret en ønskeliste</h1>
  <form id="createForm">
    <label for="creator_name">Dit navn</label>
    <input type="text" id="creator_name">
    
    <label for="title">Listens titel</label>
    <input type="text" id="title">

    <label for="event_name">Begivenhedens navn</label>
    <input type="text" id="event_name">

    <label for="event_date">Næste begivenhed</label>
    <input type="date" id="event_date" required>

    <button type="submit">Opret listen</button>
  </form>

  <div id="result">
    <p class="hint">
      <strong>Gem dette link.</strong>
      Det er din måde at redigere listen — bogmærk det, eller send det til dig selv.
    </p>
    <a id="creatorLink" href="#"></a>
    <p class="hint">
      <strong>Del dette link med dine gæster.</strong>
      De kan se listen og reservere gaver uden at oprette en konto.
    </p>
    <a id="guestLink" href="#"></a>
  </div>

  <script>
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const creator_name = document.getElementById('creator_name').value;
      const title = document.getElementById('title').value;
      const event_date = document.getElementById('event_date').value;
      const event_name = document.getElementById('event_name').value;

      const res = await fetch('/lists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ creator_name, title, event_name, event_date })
      });

      const data = await res.json();

      const creatorUrl = `${location.origin}/creator.html?list=${data.list_id}&token=${data.creator_token}`;
      const guestUrl = `${location.origin}/guest.html?list=${data.list_id}`;

      // Save to browser dashboard
      try {
        const stored = JSON.parse(localStorage.getItem('oensker_lists') || '[]');
        stored.unshift({
          id: data.list_id,
          token: data.creator_token,
          title: title,
          event_name: event_name,
          event_date: event_date,
          created_at: new Date().toISOString()
        });
        localStorage.setItem('oensker_lists', JSON.stringify(stored));
      } catch (e) {
        console.error('Kunne ikke gemme listen lokalt', e);
      }

      document.getElementById('creatorLink').href = creatorUrl;
      document.getElementById('creatorLink').textContent = 'Gå til din liste (rediger)';
      document.getElementById('guestLink').href = guestUrl;
      document.getElementById('guestLink').textContent = 'Se listen som gæst';
      document.getElementById('result').style.display = 'block';
      document.getElementById('createForm').style.display = 'none';
      document.getElementById('pageTitle').style.display = 'none';
    });
  </script>
</body>
</html>
