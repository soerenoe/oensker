<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page_title">Ønsker – Mine lister</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#222222">
  
</head>
<body>

  <h1 data-i18n="heading">Mine lister</h1>
  <p class="hint" data-i18n="hint_dashboard">
    Her finder du alle de lister, du har oprettet på denne enhed.
  </p>

  <div id="lists-container">
    <!-- Lists injected here -->
  </div>

  <a href="/newlist.html" class="btn" style="margin-top: 1rem;" data-i18n="btn_create_new">Opret en ny ønskeliste</a>

  <script>
    const translations = {
      da: {
        page_title: "Ønsker – Mine lister",
        heading: "Mine lister",
        hint_dashboard: "Her finder du alle de lister, du har oprettet på denne enhed.",
        btn_create_new: "Opret en ny ønskeliste",
        btn_edit: "Rediger",
        btn_share: "Del ønskeliste",
        btn_share_copied: "Link kopieret",
        btn_delete: "Slet",
        empty_title: "Du har ingen lister endnu.",
        empty_desc: "Opret din første ønskeliste ved at trykke på knappen nedenfor.",
        no_title: "Uden titel",
        no_date: "Ingen dato",
        event_prefix: "Begivenhed: ",
        confirm_delete: "Er du sikker på, at du vil slette denne liste? Det kan ikke fortrydes."
      }
    };

    const lang = localStorage.getItem('oensker_lang') || 'da';
    const t = translations[lang];

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.innerHTML = t[key];
    });

    function formatDanishDate(dateString) {
      if (!dateString) return '';
      return new Date(dateString).toLocaleDateString('da-DK', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const container = document.getElementById('lists-container');
    const raw = localStorage.getItem('oensker_lists');
    const lists = raw ? JSON.parse(raw) : [];

    if (lists.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="text-align: center; padding: 3rem 1rem; border: 2px dashed var(--border); border-radius: 8px;">
          <h2>${t.empty_title}</h2>
          <p>${t.empty_desc}</p>
        </div>
      `;
    } else {
      container.innerHTML = lists.map(l => {
        let subtitle = t.no_date;
        if (l.event_name && l.event_date) {
          subtitle = `${l.event_name} • ${formatDanishDate(l.event_date)}`;
        } else if (l.event_date) {
          subtitle = formatDanishDate(l.event_date);
        } else if (l.event_name) {
          subtitle = l.event_name;
        }

        return `
        <div class="card">
          <h2>${escapeHtml(l.title || t.no_title)}</h2>
          <div class="date-badge">${escapeHtml(subtitle)}</div>
          <div class="actions">
            <a class="btn" href="/creator.html?list=${encodeURIComponent(l.id)}&token=${encodeURIComponent(l.token)}">${t.btn_edit}</a>
            <button class="btn secondary" data-copy="${l.id}">${t.btn_share}</button>
            <button class="btn danger" data-delete="${l.id}">${t.btn_delete}</button>
          </div>
        </div>
        `;
      }).join('');

      container.addEventListener('click', async (e) => {
        const copyId = e.target.dataset.copy;
        const delId = e.target.dataset.delete;
        
        if (copyId) {
          const list = lists.find(x => x.id === copyId);
          const url = `${location.origin}/guest.html?list=${encodeURIComponent(list.id)}`;
          await navigator.clipboard.writeText(url);
          e.target.textContent = t.btn_share_copied;
          setTimeout(() => e.target.textContent = t.btn_share, 1500);
        }

        if (delId) {
          if (!confirm(t.confirm_delete)) return;
          const list = lists.find(x => x.id === delId);
          try {
            await fetch(`/lists/${encodeURIComponent(list.id)}?creator_token=${encodeURIComponent(list.token)}`, { method: 'DELETE' });
          } catch (err) { console.warn('Delete failed', err); }
          const next = lists.filter(x => x.id !== delId);
          localStorage.setItem('oensker_lists', JSON.stringify(next));
          location.reload();
        }
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
