<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#222222">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ønsker - oversigtgit push</title>
</head>
<body>
  <a href="/" style="display: inline-block; margin-bottom: 1rem; color: #666; text-decoration: none; font-size: 0.9rem;">← Tilbage til mine lister</a>
  <h1 id="listTitle">Indlæser...</h1>
  <div class="event-date" id="deletionNote"></div>
  <div class="actions">
    <button id="copy-guest-link" class="btn secondary">Del ønskeliste</button>
    <button id="delete-list-btn" class="btn danger">Slet</button>
  </div>

  <div id="itemsList"></div>

  <form id="addItemForm">
    <label for="name">Ønske</label>
    <input type="text" id="name">

    <label for="price">Pris</label>
    <input type="text" id="price">

    <label for="remark">Bemærkning</label>
    <input type="text" id="remark">

    <label for="link">Link</label>
    <input type="url" id="link" placeholder="https://...">

    <button type="submit">Tilføj ønske</button>
  </form>

  <!-- Modal for viewing/editing an item -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2>Rediger ønske</h2>
      <label for="editName">Navn</label>
      <input type="text" id="editName" required>

      <label for="editPrice">Pris</label>
      <input type="text" id="editPrice">

      <label for="editRemark">Bemærkning</label>
      <input type="text" id="editRemark">

      <label for="editLink">Link</label>
      <input type="url" id="editLink">

      <div class="modal-actions">
        <button type="submit" class="btn" style="width: auto;">Gem ændringer</button>
        <button type="button" class="btn secondary" style="width: auto;">Annuller</button>
        <button type="button" class="btn danger" style="width: auto;">Slet ønske</button>
      </div>
    </div>
  </div>

  <script>
    const copyBtn = document.getElementById('copy-guest-link');
    if (copyBtn) {
      copyBtn.addEventListener('click', async (e) => {
        const url = `${location.origin}/guest.html?list=${new URLSearchParams(location.search).get('list')}`;
        await navigator.clipboard.writeText(url);
        const originalText = e.target.textContent;
        e.target.textContent = 'Link kopieret';
        setTimeout(() => e.target.textContent = originalText, 2000);
      });
    } else {
      console.warn("Kunne ikke finde 'copy-guest-link' knappen i HTML'en.");
    }
    const params = new URLSearchParams(location.search);
    const listId = params.get('list');
    const creatorToken = params.get('token');
    let currentEditId = null;

    async function loadList() {
      const res = await fetch(`/lists/${listId}/creator?creator_token=${creatorToken}`);
      if (!res.ok) {
        document.getElementById('listTitle').textContent = 'List not found or unauthorized';
        return;
      }
      const data = await res.json();
      document.getElementById('listTitle').textContent = data.title;

      const deletionDate = new Date(data.event_date);
      deletionDate.setFullYear(deletionDate.getFullYear() + 1);
      document.getElementById('deletionNote').textContent =
        `Denne liste vil automatisk slettes den ${deletionDate.toISOString().split('T')[0]}, hvis den ikke opdateres inden da`;

      const guestUrl = `${location.origin}/guest.html?list=${listId}`;
      document.getElementById('guestLink').href = guestUrl;
      document.getElementById('guestLink').textContent = guestUrl;

      const itemsList = document.getElementById('itemsList');
      itemsList.innerHTML = '';
        data.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
            <div class="item-name">${item.name}</div>
            <div class="item-meta">${item.price ? item.price : ''}</div>
            `;
            card.addEventListener('click', () => openEditModal(item));
            itemsList.appendChild(card);
        });
    }

    function openEditModal(item) {
      currentEditId = item.item_id;
      document.getElementById('editName').value = item.name || '';
      document.getElementById('editPrice').value = item.price || '';
      document.getElementById('editRemark').value = item.remark || '';
      document.getElementById('editLink').value = item.link || '';
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      currentEditId = null;
    }

    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const body = {
        creator_token: creatorToken,
        name: document.getElementById('editName').value,
        price: document.getElementById('editPrice').value || null,
        remark: document.getElementById('editRemark').value || null,
        link: document.getElementById('editLink').value || null,
      };
      await fetch(`/items/${currentEditId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      closeModal();
      loadList();
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      await fetch(`/items/${currentEditId}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ creator_token: creatorToken })
      });
      closeModal();
      loadList();
    });

    document.getElementById('addItemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        creator_token: creatorToken,
        name: document.getElementById('name').value,
        price: document.getElementById('price').value || null,
        remark: document.getElementById('remark').value || null,
        link: document.getElementById('link').value || null,
      };

      await fetch(`/lists/${listId}/items`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      e.target.reset();
      loadList();
    });

    document.getElementById('deleteListBtn').addEventListener('click', () => {
      const confirmOverlay = document.createElement('div');
      confirmOverlay.className = 'modal-overlay';
      confirmOverlay.style.display = 'flex';
      confirmOverlay.innerHTML = `
        <div class="modal-box">
          <p><strong>Slet listen permanent?</strong></p>
          <p>Dette kan ikke fortrydes</p>
          <div class="modal-actions">
            <button id="confirmCancelBtn">Annuler</button>
            <button class="cancel-btn" id="confirmDeleteBtn" type="button" style="font-size:0.85rem;">Slet permanent</button>
          </div>
        </div>
      `;
      document.body.appendChild(confirmOverlay);

      document.getElementById('confirmCancelBtn').addEventListener('click', () => {
        confirmOverlay.remove();
      });
      document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
        await fetch(`/lists/${listId}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ creator_token: creatorToken })
        });
        document.body.innerHTML = '<p style="text-align:center;margin-top:60px;font-family:system-ui;">This list has been deleted.</p>';
      });
    });

    loadList();

  document.getElementById('copy-guest-link').addEventListener('click', async (e) => {
    const url = `${location.origin}/guest.html?list=${new URLSearchParams(location.search).get('list')}`;
    await navigator.clipboard.writeText(url);
    const originalText = e.target.textContent;
    e.target.textContent = 'Link kopieret';
    setTimeout(() => e.target.textContent = originalText, 2000);
  });
  </script>
</body>
</html>
