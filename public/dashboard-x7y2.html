<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page_title">Ønsker – Mine lister</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#222222">
</head>
<body>

  <h1 data-i18n="heading">Mine ønskelister</h1>
  <p class="hint" data-i18n="hint_dashboard">
    Her finder du alle de lister, du har oprettet på denne enhed.
  </p>

  <div id="lists-container">
    <!-- Lists injected here -->
  </div>

  <a href="/newlist-p2q8.html" id="createListBtn" class="btn" style="margin-top: 1rem;" data-i18n="btn_create_new">Opret en ny ønskeliste</a>

  <!-- Edit List Modal -->
  <div id="editListModal" class="modal-overlay">
    <div class="modal-box">
      <h2>Rediger listeoplysninger</h2>
      
      <label for="editListTitle">Listens titel</label>
      <input type="text" id="editListTitle">
      
      <label for="editListEventName">Begivenhedens navn</label>
      <input type="text" id="editListEventName" placeholder="f.eks. Jul">
      
      <label for="editListEventDate">Dato for begivenheden</label>
      <input type="date" id="editListEventDate">
      
      <div class="actions" style="margin-top: 1.5rem;">
        <button id="saveListInfoBtn" class="btn">Gem ændringer</button>
        <button id="cancelListInfoBtn" class="btn secondary">Annuller</button>
      </div>
    </div>
  </div>

  <script>
    // Check if an invite code was passed, or grab it from local storage
    const urlParams = new URLSearchParams(location.search);
    let inviteCode = urlParams.get('invite') || localStorage.getItem('oensker_invite_code');

    if (inviteCode) {
      localStorage.setItem('oensker_invite_code', inviteCode);
      const createBtn = document.getElementById('createListBtn');
      if (createBtn) {
        createBtn.href = `/newlist-p2q8.html?invite=${inviteCode}`;
      }
    }
    
    if (inviteCode) {
      const createBtn = document.getElementById('createListBtn');
      if (createBtn) {
        createBtn.href = `/newlist-p2q8.html?invite=${inviteCode}`;
      }
    }

    const translations = {
      da: {
        page_title: "Ønsker – Mine ønskelister",
        heading: "Mine ønskelister",
        hint_dashboard: "Her finder du alle de lister, du har oprettet på denne enhed.",
        btn_create_new: "Opret en ny ønskeliste",
        btn_edit: "Rediger ønsker",
        btn_edit_info: "Rediger info",
        btn_share: "Del ønskeliste",
        btn_share_copied: "Link kopieret",
        btn_delete: "Slet",
        empty_title: "Du har ingen lister endnu.",
        empty_desc: "Opret din første ønskeliste ved at trykke på knappen nedenfor.",
        no_title: "Uden titel",
        no_date: "Ingen dato",
        event_prefix: "Begivenhed: ",
        confirm_delete: "Er du sikker på, at du vil slette denne liste? Det kan ikke fortrydes."
      }
    };

    const lang = localStorage.getItem('oensker_lang') || 'da';
    const t = translations[lang];

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.innerHTML = t[key];
    });

    function formatDanishDate(dateString) {
      if (!dateString) return '';
      return new Date(dateString).toLocaleDateString('da-DK', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const container = document.getElementById('lists-container');
    let lists = JSON.parse(localStorage.getItem('oensker_lists') || '[]');

    async function verifyLists() {
      if (lists.length === 0) return;
      let changed = false;
      const validLists = [];
      
      for (const l of lists) {
        try {
          const res = await fetch(`/lists/${l.id}/creator?creator_token=${l.token}`);
          if (res.ok) {
            validLists.push(l);
          } else {
            changed = true; // List was deleted from DB or is invalid
          }
        } catch (e) {
          validLists.push(l); // Keep on network error to be safe
        }
      }
      
      if (changed) {
        lists = validLists;
        localStorage.setItem('oensker_lists', JSON.stringify(lists));
        renderDashboard(); // Re-render without reloading the page
      }
    }

    function renderDashboard() {
      if (lists.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>${t.empty_title}</h2>
            <p>${t.empty_desc}</p>
          </div>
        `;
      } else {
        container.innerHTML = lists.map(l => {
          let subtitle = t.no_date;
          if (l.event_name && l.event_date) {
            subtitle = `${l.event_name} • ${formatDanishDate(l.event_date)}`;
          } else if (l.event_date) {
            subtitle = formatDanishDate(l.event_date);
          } else if (l.event_name) {
            subtitle = l.event_name;
          }

          const creatorUrl = `/creator-w5n1.html?list=${encodeURIComponent(l.id)}&token=${encodeURIComponent(l.token)}`;
          
          return `
          <div class="card clickable-card" data-url="${creatorUrl}">
            <h2>${escapeHtml(l.title || t.no_title)}</h2>
            <div class="date-badge">${escapeHtml(subtitle)}</div>
            <div class="actions">
              <button class="btn secondary" data-editinfo="${l.id}">${t.btn_edit_info}</button>
              <button class="btn secondary" data-copy="${l.id}">${t.btn_share}</button>
            </div>
          </div>
          `;
        }).join('');
      }
    }

    // Initial render
    renderDashboard();

    // Check if lists still exist on server
    verifyLists();

    container.addEventListener('click', async (e) => {
      const copyId = e.target.dataset.copy;
      const editInfoId = e.target.dataset.editinfo;
      
      if (copyId) {
        const list = lists.find(x => x.id === copyId);
        const url = `${location.origin}/guest-t3z6.html?list=${encodeURIComponent(list.id)}`;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        if (isMobile && navigator.share) {
          try { await navigator.share({ title: list.title, url: url }); } catch (err) { }
        } else {
          await navigator.clipboard.writeText(url);
          e.target.textContent = t.btn_share_copied;
          setTimeout(() => e.target.textContent = t.btn_share, 1500);
        }
      }
      
      if (editInfoId) {
        const list = lists.find(x => x.id === editInfoId);
        document.getElementById('editListTitle').value = list.title || '';
        document.getElementById('editListEventName').value = list.event_name || '';
        document.getElementById('editListEventDate').value = list.event_date || '';
        
        const modal = document.getElementById('editListModal');
        modal.style.display = 'flex';
        modal.dataset.currentListId = editInfoId;
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // --- EDIT LIST INFO MODAL LOGIC ---
    const editListModal = document.getElementById('editListModal');
    const cancelListInfoBtn = document.getElementById('cancelListInfoBtn');
    const saveListInfoBtn = document.getElementById('saveListInfoBtn');
    
    if (cancelListInfoBtn && editListModal) {
      cancelListInfoBtn.addEventListener('click', () => {
        editListModal.style.display = 'none';
      });
    }

    if (saveListInfoBtn && editListModal) {
      saveListInfoBtn.addEventListener('click', async (e) => {
        const listId = editListModal.dataset.currentListId;
        const list = lists.find(x => x.id === listId);
        
        const newTitle = document.getElementById('editListTitle').value;
        const newEventName = document.getElementById('editListEventName').value;
        const newEventDate = document.getElementById('editListEventDate').value;
        
        const res = await fetch(`/lists/${listId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            creator_token: list.token,
            title: newTitle, 
            event_name: newEventName, 
            event_date: newEventDate 
          })
        });

        if (res.ok) {
          list.title = newTitle;
          list.event_name = newEventName;
          list.event_date = newEventDate;
          localStorage.setItem('oensker_lists', JSON.stringify(lists));
          editListModal.style.display = 'none';
          location.reload();
        } else {
          alert('Kunne ikke gemme ændringerne');
        }
      });
    }
  </script>

</body>
</html>
