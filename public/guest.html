<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#222222">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ønskeliste</title>
</head>
<body>
  <h1 id="listTitle">Indlæser...</h1>
  <div class="event-date" id="creatorName"></div>
  <div class="event-date" id="eventDate"></div>

  <button class="share-btn" id="shareBtn">Del denne liste</button>

  <div id="itemsList"></div>

  <!-- Modal for viewing an item and reserving/cancelling -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2 id="modalName"></h2>
      <p id="modalPrice"></p>
      <p id="modalRemark"></p>
      <p id="modalLink"></p>
      <p id="modalStatus"></p>

      <div id="reserveSection" style="display:none;">
        <label for="guestName">Dit navn</label>
        <input type="text" id="guestName">
      </div>

      <div class="modal-actions">
        <button id="actionBtn" class="btn" style="width: auto;"></button>
        <button class="btn secondary" id="closeBtn" type="button" style="width: auto;">Luk</button>
      </div>

    </div>
  </div>

  <script>
    function formatDanishDate(dateString) {
      if (!dateString) return '';
      return new Date(dateString).toLocaleDateString('da-DK', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const params = new URLSearchParams(location.search);
    const listId = params.get('list');
    let currentItem = null;

    // Get or create a persistent guest token for this browser
    let guestToken = localStorage.getItem('oensker_guest_token');
    if (!guestToken) {
      guestToken = crypto.randomUUID();
      localStorage.setItem('oensker_guest_token', guestToken);
    }

    async function loadList() {
      const res = await fetch(`/lists/${listId}/guest`);
      if (!res.ok) {
        document.getElementById('listTitle').textContent = 'List not found';
        return;
      }
      const data = await res.json();
      document.getElementById('listTitle').textContent = data.title;
      document.getElementById('creatorName').textContent = `Af ${data.creator_name}`;

      if (data.event_name && data.event_date) {
        document.getElementById('eventDate').textContent = `${data.event_name} • ${formatDanishDate(data.event_date)}`;
      } else if (data.event_date) {
        document.getElementById('eventDate').textContent = `Til ${formatDanishDate(data.event_date)}`;
      } else if (data.event_name) {
        document.getElementById('eventDate').textContent = data.event_name;
      }

      const itemsList = document.getElementById('itemsList');
      itemsList.innerHTML = '';
      data.items.forEach(item => {
        const isMine = item.guest_token === guestToken;
        const isReserved = !!item.guest_token;

        const card = document.createElement('div');
        card.className = 'item-card' + (isMine ? ' mine' : '');
        card.innerHTML = `
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-meta">${item.price ? item.price : ''}</div>
          </div>
          <span class="badge ${isMine ? 'mine' : (isReserved ? 'reserved' : 'available')}">
            ${isMine ? 'Reserveret af dig' : (isReserved ? 'Reserveret' : 'Ikke reserveret')}
          </span>
        `;
        card.addEventListener('click', () => openItemModal(item, isMine, isReserved));
        itemsList.appendChild(card);
      });
    }

    function openItemModal(item, isMine, isReserved) {
      // 1. Populate the item details
      document.getElementById('modalName').textContent = item.name;
      document.getElementById('modalPrice').textContent = item.price ? `Pris: ${item.price}` : '';
      document.getElementById('modalRemark').textContent = item.remark ? `Bemærkning: ${item.remark}` : '';
      document.getElementById('modalLink').textContent = item.link ? `Link: ${item.link}` : '';
      
      // 2. Get the button and status elements
      const actionBtn = document.getElementById('actionBtn');
      const statusEl = document.getElementById('modalStatus');
      const reserveSection = document.getElementById('reserveSection');

      // 3. Handle the logic based on reservation status
      if (isMine) {
        // The guest viewing it is the one who reserved it
        statusEl.textContent = 'Du har reserveret ønsket';
        if (reserveSection) reserveSection.style.display = 'none';
        
        actionBtn.style.display = 'inline-flex';
        actionBtn.textContent = 'Annuller min reservation';
        actionBtn.className = 'btn secondary'; // Make it look like a cancel action
        actionBtn.onclick = () => cancelReservation(item.item_id);
        
      } else if (isReserved) {
        // Someone else has reserved it
        statusEl.textContent = 'Allerede reserveret af en anden';
        if (reserveSection) reserveSection.style.display = 'none';
        
        // Hide the action button entirely so they can't click it
        actionBtn.style.display = 'none';
        
      } else {
        // It is not reserved by anyone yet
        statusEl.textContent = 'Ikke reserveret';
        
        // Show the button and set it to Reserve
        actionBtn.style.display = 'inline-flex';
        actionBtn.textContent = 'Reserver';
        actionBtn.className = 'btn'; // Primary button style
        actionBtn.onclick = () => {
            // Assuming you have a function to handle the reservation
            // If the user needs to enter a name, this should trigger that.
            reserveItem(item.item_id); 
        };
      }

      // 4. Show the modal
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      currentItem = null;
    }

    async function reserveItem() {
      const guestName = document.getElementById('guestName').value || null;
      await fetch(`/items/${currentItem.item_id}/reserve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guest_token: guestToken, guest_name: guestName })
      });
      closeModal();
      loadList();
    }

    async function cancelReservation() {
      await fetch(`/items/${currentItem.item_id}/reserve`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guest_token: guestToken })
      });
      closeModal();
      loadList();
    }

    document.getElementById('closeBtn').addEventListener('click', closeModal);

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const shareData = {
        title: 'Wishlist',
        text: 'Check out this wishlist!',
        url: location.href
      };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) { /* user cancelled */ }
      } else {
        navigator.clipboard.writeText(location.href);
        alert('Link kopieret');
      }
    });

    loadList();
  </script>
</body>
</html>
