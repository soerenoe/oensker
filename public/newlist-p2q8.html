<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <link rel="icon" type="image/png" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#222222">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ønsker</title>
</head>
<body>
  <a href="/dashboard-x7y2.html" style="display: inline-block; margin-bottom: 1rem; color: #666; text-decoration: none; font-size: 0.9rem;">← Tilbage til mine lister</a>
  <h1 id="pageTitle">Opret en ønskeliste</h1>
  <form id="createForm">
    <label for="creator_name">Dit navn</label>
    <input type="text" id="creator_name">
    
    <label for="title">Listens titel</label>
    <input type="text" id="title">

    <label for="event_name">Begivenhedens navn</label>
    <input type="text" id="event_name">

    <label for="event_date">Næste begivenhed</label>
    <input type="date" id="event_date" required>

    <button type="submit" class="btn">Opret listen</button>
  </form>

<script>
    // 1. Check for invite code in URL, then fallback to localStorage (for PWA)
    const urlParams = new URLSearchParams(location.search);
    let inviteCode = urlParams.get('invite') || localStorage.getItem('oensker_invite_code');

    if (inviteCode) {
      // Save it for future PWA visits
      localStorage.setItem('oensker_invite_code', inviteCode);
    } else {
      // If no code is found, show a login prompt instead of a 404
      document.getElementById('createForm').style.display = 'none';
      document.getElementById('pageTitle').textContent = 'Log ind';
      
      const loginDiv = document.createElement('div');
      loginDiv.innerHTML = `
        <p class="hint" style="color: var(--danger); margin-bottom: 1rem;">Du skal indtaste din invitationskode for at oprette en ønskeliste.</p>
        <input type="text" id="manualInviteCode" placeholder="Indtast kode her..." style="margin-bottom: 1rem;">
        <button id="manualLoginBtn" class="btn" type="button">Log ind</button>
      `;
      document.getElementById('pageTitle').parentNode.insertBefore(loginDiv, document.getElementById('createForm'));

      document.getElementById('manualLoginBtn').addEventListener('click', () => {
        const code = document.getElementById('manualInviteCode').value.trim();
        if (code) {
          localStorage.setItem('oensker_invite_code', code);
          window.location.reload(); 
        }
      });
    }

    // 2. Handle form submission
    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (!inviteCode) {
        alert("Der skete en fejl: Invitationskode mangler.");
        return;
      }

      const creator_name = document.getElementById('creator_name').value;
      const title = document.getElementById('title').value;
      const event_date = document.getElementById('event_date').value;
      const event_name = document.getElementById('event_name').value;

      const res = await fetch('/lists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ invite_code: inviteCode, creator_name, title, event_name, event_date })
      });

      const data = await res.json();

      if (!res.ok || !data.list_id) {
        alert("Der skete en fejl: " + (data.error || "Kunne ikke oprette listen"));
        console.error("Server response:", data);
        return; 
      }

      const creatorUrl = `${location.origin}/creator-w5n1.html?list=${data.list_id}&token=${data.creator_token}`;

      // Save to browser dashboard
      try {
        const stored = JSON.parse(localStorage.getItem('oensker_lists') || '[]');
        stored.unshift({
          id: data.list_id,
          token: data.creator_token,
          title: title,
          event_name: event_name,
          event_date: event_date,
          created_at: new Date().toISOString()
        });
        localStorage.setItem('oensker_lists', JSON.stringify(stored));
      } catch (err) {
        console.error('Kunne ikke gemme listen lokalt', err);
      }

      window.location.href = creatorUrl;
    });
  </script>
</body>
</html>
